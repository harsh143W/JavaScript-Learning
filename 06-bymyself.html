<!DOCTYPE html>
<html lang="en">
<head>
  <title>Roak Game</title>

  <style>

    p{
      font-size: 35px;
    }

    button{
      height: 150px;
      font-size: 25px;
      width: 200px;
      border:none;
      border: 2px solid #04AA6D;
      margin-right: 25px;
    }

    .hover{
        background-color: rgb(25, 188, 197);
        color:white;
      }

  </style>
</head>
<body>
  
  <p> Roak Paper Scissors </p>

  <button class="hover" onclick="
    const randomNumber = Math.random();

    let computerMove = '';

    if (randomNumber >=0 && randomNumber < 1/3 ){
      computerMove = 'Roak';
    }else if (randomNumber >= 1/3 && randomNumber < 2/3) {
      computerMove = 'Paper';
    } else if (randomNumber >= 2/3 && randomNumber < 1) {
      computerMove = 'Scissors'
     }

     let result = '';

     if(computerMove === 'Roak') {
      result = 'Both choose same';
     } else if (computerMove === 'Paper') {
      result = 'You lose';
     } else if (computerMove === 'Scissors') {
      result = 'You Win '
     }

     alert(`You picked roak, computer picked ${computerMove}. ${result}`);

  "> Roak </button>

  <button class="hover" onclick="
    const randomNumber = Math.random();

    let computerMove = '';

    if (randomNumber >=0 && randomNumber < 1/3 ){
      computerMove = 'Roak';
    }else if (randomNumber >= 1/3 && randomNumber < 2/3) {
      computerMove = 'Paper';
    } else if (randomNumber >= 2/3 && randomNumber < 1) {
      computerMove = 'Scissors'
     }

     let result = '';

     if(computerMove === 'Roak') {
      result = 'You win';
     } else if (computerMove === 'Paper') {
      result = 'Both choose same ';
     } else if (computerMove === 'Scissors') {
      result = 'You Lose';
     }

     alert(`You picked Paper, computer picked ${computerMove}. ${result}`);
  "> Paper </button>

  <button class="hover" onclick="
    const randomNumber = Math.random();

    let computerMove = '';

    if (randomNumber >=0 && randomNumber < 1/3 ){
      computerMove = 'Roak';
    }else if (randomNumber >= 1/3 && randomNumber < 2/3) {
      computerMove = 'Paper';
    } else if (randomNumber >= 2/3 && randomNumber < 1) {
      computerMove = 'Scissors'
     }

     let result = '';

     if(computerMove === 'Roak') {
      result = 'You lose';
     } else if (computerMove === 'Paper') {
      result = 'You win';
     } else if (computerMove === 'Scissors') {
      result = 'Both choose same '
     }

     alert(`You picked Scissors, computer picked ${computerMove}. ${result}`);
  "> Scissors </button>

</body>
</html>
